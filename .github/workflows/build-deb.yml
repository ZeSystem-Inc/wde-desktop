name: Build XFCE5 Package

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc g++ libgtk-3-dev libwayland-dev libwayland-bin libwlroots-dev wayland-protocols pkg-config libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libseat-dev libpixman-1-dev libgtk-layer-shell-dev libxkbcommon-dev

      - name: Create Package Directory Structure
        run: |
          mkdir -p xfce5-desktop/usr/bin
          mkdir -p xfce5-desktop/usr/share/wayland-sessions
          mkdir -p xfce5-desktop/DEBIAN

      - name: Generate Wayland Protocols
        run: |
          wayland-scanner server-header /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml xdg-shell-protocol.h

      - name: Generate Package Control & Desktop Files
        run: |
          cat << 'EOF' > xfce5-desktop/DEBIAN/control
          Package: xfce5
          Version: 5.0.0-alpha
          Section: x11
          Priority: optional
          Architecture: amd64
          Maintainer: Salih <salih@example.com>
          Depends: libgtk-3-0, rofi, libwayland-server0, dbus-x11, adwaita-icon-theme, libgtk-layer-shell0
          Description: Native GTK3 and Wayland Desktop Environment XFCE5.
          EOF

          cat << 'EOF' > xfce5-desktop/usr/share/wayland-sessions/xfce5.desktop
          [Desktop Entry]
          Name=XFCE5 (Wayland Native)
          Comment=XFCE5 Native GTK3 Wayland Desktop
          Exec=/usr/bin/xfce5-session
          Type=Application
          DesktopNames=XFCE5;XFCE;GTK;
          EOF

          cat << 'EOF' > xfce5-desktop/usr/bin/xfce5-session
          #!/bin/sh
          exec > /tmp/xfce5-session.log 2>&1
          echo "[XFCE5] Oturum Başlatılıyor..."

          export XDG_CURRENT_DESKTOP=XFCE5:XFCE
          export XDG_SESSION_DESKTOP=xfce5
          export XDG_SESSION_TYPE=wayland
          export GTK_THEME=Adwaita
          export GDK_BACKEND=wayland
          export QT_QPA_PLATFORM=wayland

          export WLR_NO_HARDWARE_CURSORS=1
          export WLR_RENDERER_ALLOW_SOFTWARE=1

          if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
              eval $(dbus-launch --sh-syntax --exit-with-session)
          fi

          rm -f /tmp/xfce5_wayland_socket

          /usr/bin/xfce5-autoscale-daemon &

          /usr/bin/xfce5-wm > /tmp/xfce5-wm.log 2>&1 &
          WM_PID=$!

          i=0
          while [ ! -f /tmp/xfce5_wayland_socket ] && [ $i -lt 100 ]; do
              sleep 0.1
              i=$((i+1))
          done

          if [ -f /tmp/xfce5_wayland_socket ]; then
              export WAYLAND_DISPLAY=$(cat /tmp/xfce5_wayland_socket)
              echo "[XFCE5] Wayland Soketi Başarıyla Oluştu: $WAYLAND_DISPLAY"
          else
              echo "[XFCE5] HATA: Wayland soketi oluşmadı!"
              wait $WM_PID
              exit 1
          fi

          /usr/bin/xfce5-panel > /tmp/xfce5-panel.log 2>&1 &

          wait $WM_PID
          EOF

      - name: Compile Native Core Binaries
        run: |
          g++ src/autoscale.cpp -o xfce5-desktop/usr/bin/xfce5-autoscale-daemon
          gcc -DWLR_USE_UNSTABLE -I. src/wm.c -o xfce5-desktop/usr/bin/xfce5-wm $(pkg-config --cflags --libs wayland-server wlroots gbm egl glesv2 libdrm pixman-1 xkbcommon)
          g++ src/panel.cpp -o xfce5-desktop/usr/bin/xfce5-panel $(pkg-config --cflags --libs gtk+-3.0 gtk-layer-shell-0)

      - name: Set Permissions
        run: |
          chmod +x xfce5-desktop/usr/bin/*
          chmod 755 xfce5-desktop/DEBIAN/control

      - name: Build DEB Package
        run: |
          dpkg-deb --build xfce5-desktop xfce5_5.0.0-alpha_amd64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfce5-deb
          path: xfce5_5.0.0-alpha_amd64.deb
