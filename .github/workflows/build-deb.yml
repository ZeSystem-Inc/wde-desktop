name: Build XFCE5 Package

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y g++ libgtk-3-dev libwayland-dev libwlroots-dev wayland-protocols pkg-config

      - name: Create Package Directory Structure
        run: |
          mkdir -p xfce5-desktop/usr/bin
          mkdir -p xfce5-desktop/usr/share/wayland-sessions
          mkdir -p xfce5-desktop/DEBIAN

      - name: Generate Package Control & Desktop Files
        run: |
          cat << 'EOF' > xfce5-desktop/DEBIAN/control
          Package: xfce5
          Version: 5.0.0-alpha
          Section: x11
          Priority: optional
          Architecture: amd64
          Maintainer: Salih <salih@example.com>
          Depends: libgtk-3-0, rofi, libwayland-server0, libwlroots10, dbus-x11, adwaita-icon-theme
          Description: Native GTK3 and Wayland C++ Desktop Environment XFCE5.
          EOF

          cat << 'EOF' > xfce5-desktop/usr/share/wayland-sessions/xfce5.desktop
          [Desktop Entry]
          Name=XFCE5 (Wayland Native)
          Comment=XFCE5 Native GTK3 Wayland Desktop
          Exec=/usr/bin/xfce5-session
          Type=Application
          DesktopNames=XFCE5;GTK;
          EOF

          cat << 'EOF' > xfce5-desktop/usr/bin/xfce5-session
          #!/bin/sh
          export XDG_CURRENT_DESKTOP=XFCE5
          export XDG_SESSION_TYPE=wayland
          export GDK_BACKEND=wayland,x11
          export GTK_THEME=Adwaita

          export WLR_RENDERER=pixman
          export WLR_NO_HARDWARE_CURSORS=1
          export LIBGL_ALWAYS_SOFTWARE=1

          if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
              eval $(dbus-launch --sh-syntax --exit-with-session)
          fi

          /usr/bin/xfce5-autoscale-daemon
          if [ -f /tmp/xfce5_env ]; then
              . /tmp/xfce5_env
          fi

          /usr/bin/xfce5-wm &
          sleep 1

          # 2. GTK3 C++ Paneli Başlatıyoruz
          exec /usr/bin/xfce5-panel
          EOF

      - name: Compile Native Core Binaries
        run: |
          g++ -O2 src/autoscale.cpp -o xfce5-desktop/usr/bin/xfce5-autoscale-daemon
          g++ -O2 src/wm.cpp -o xfce5-desktop/usr/bin/xfce5-wm $(pkg-config --cflags --libs wayland-server wlroots)
          g++ -O2 src/panel.cpp -o xfce5-desktop/usr/bin/xfce5-panel $(pkg-config --cflags --libs gtk+-3.0)

      - name: Set Permissions
        run: |
          chmod +x xfce5-desktop/usr/bin/*
          chmod 755 xfce5-desktop/DEBIAN/control

      - name: Build DEB Package
        run: |
          dpkg-deb --build xfce5-desktop xfce5_5.0.0-alpha_amd64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfce5-deb
          path: xfce5_5.0.0-alpha_amd64.deb
