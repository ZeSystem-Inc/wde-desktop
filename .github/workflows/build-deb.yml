name: Build WDE Package

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ pkg-config \
                              libwlroots-dev libwayland-dev wayland-protocols libwayland-bin \
                              libgtk-3-dev libgtk-layer-shell-dev

      - name: Create Package Directory Structure
        run: |
          mkdir -p wde-desktop/usr/bin
          mkdir -p wde-desktop/usr/share/wayland-sessions
          mkdir -p wde-desktop/DEBIAN

      - name: Generate Package Control & Session Files
        run: |
          cat << 'EOF' > wde-desktop/DEBIAN/control
          Package: wde
          Version: 1.0.0-alpha
          Section: x11
          Priority: optional
          Architecture: amd64
          Maintainer: Salih <salih@example.com>
          Depends: libgtk-3-0, libgtk-layer-shell0, rofi, dbus-x11, adwaita-icon-theme, libwayland-server0
          Description: Windows Desktop Environment (WDE) - Lightweight Wayland Desktop Environment.
          EOF

          cat << 'EOF' > wde-desktop/usr/share/wayland-sessions/wde.desktop
          [Desktop Entry]
          Name=WDE (Windows Desktop Environment)
          Comment=Lightweight Windows-like Wayland Desktop Environment
          Exec=/usr/bin/wde-session
          Type=Application
          DesktopNames=WDE;GTK;
          EOF

          cat << 'EOF' > wde-desktop/usr/bin/wde-session
          #!/bin/sh
          exec > /tmp/wde-session.log 2>&1
          echo "[WDE] Oturum Başlatılıyor..."

          export XDG_CURRENT_DESKTOP=WDE
          export XDG_SESSION_DESKTOP=wde
          export XDG_SESSION_TYPE=wayland
          export GTK_THEME=Adwaita-dark
          export GDK_BACKEND=wayland
          export QT_QPA_PLATFORM=wayland
          export MOZ_ENABLE_WAYLAND=1

          export WLR_RENDERER=pixman
          export WLR_NO_HARDWARE_CURSORS=1

          if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
              eval $(dbus-launch --sh-syntax --exit-with-session)
          fi

          /usr/bin/wde-autoscale-daemon &
          /usr/bin/wde-panel &

          exec /usr/bin/wde-wm
          EOF

      - name: Compile Core Binaries
        run: |
          # 1. Wayland Protocol Headers (XDG Shell)
          wayland-scanner server-header /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml xdg-shell-protocol.h
          wayland-scanner private-code /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml xdg-shell-protocol.c

          # 2. WDE Compositor (C)
          gcc -I. src/wm.c xdg-shell-protocol.c -o wde-desktop/usr/bin/wde-wm $(pkg-config --cflags --libs wayland-server wlroots)

          # 3. WDE Autoscale Daemon (C++)
          g++ src/autoscale.cpp -o wde-desktop/usr/bin/wde-autoscale-daemon

          # 4. WDE Taskbar Panel (C++)
          g++ src/panel.cpp -o wde-desktop/usr/bin/wde-panel $(pkg-config --cflags --libs gtk+-3.0 gtk-layer-shell-0)

      - name: Set Executable Permissions
        run: |
          chmod +x wde-desktop/usr/bin/*
          chmod 755 wde-desktop/DEBIAN/control

      - name: Build DEB Package
        run: |
          dpkg-deb --build wde-desktop wde_1.0.0-alpha_amd64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wde-deb
          path: wde_1.0.0-alpha_amd64.deb

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: nightly
          name: "WDE Nightly Build"
          prerelease: true
          files: wde_1.0.0-alpha_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
