name: Build WDE Package (X11)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install X11, GTK & Zsh Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ pkg-config \
                              libx11-dev libxft-dev libxinerama-dev libxrandr-dev \
                              libgtk-3-dev libglib2.0-dev zsh

      - name: Create Package Directory Structure
        run: |
          mkdir -p wde-desktop/usr/bin
          mkdir -p wde-desktop/usr/share/xsessions
          mkdir -p wde-desktop/DEBIAN

      - name: Generate Control & Session Files
        run: |
          cat << 'EOF' > wde-desktop/DEBIAN/control
          Package: wde
          Version: 1.0.0-alpha
          Section: x11
          Priority: optional
          Architecture: amd64
          Maintainer: Salih <salih@example.com>
          Depends: libx11-6, libxrandr2, libgtk-3-0, dbus-x11, adwaita-icon-theme, zsh, wine
          Description: Windows Desktop Environment (WDE) - Independent Lightweight X11 Desktop Environment.
          EOF

          cat << 'EOF' > wde-desktop/usr/share/xsessions/wde.desktop
          [Desktop Entry]
          Name=WDE (Windows Desktop Environment)
          Comment=Lightweight Windows-like X11 Desktop Environment
          Exec=/usr/bin/wde-session
          Type=Application
          DesktopNames=WDE;GTK;
          EOF

          cat << 'EOF' > wde-desktop/usr/bin/wde-session
          #!/bin/sh
          exec > /tmp/wde-session.log 2>&1
          echo "[WDE] X11 Oturumu Başlatılıyor..."

          export XDG_CURRENT_DESKTOP=WDE
          export XDG_SESSION_DESKTOP=wde
          export XDG_SESSION_TYPE=x11
          export GTK_THEME=Adwaita-dark
          export SHELL=/bin/zsh

          if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
              eval $(dbus-launch --sh-syntax --exit-with-session)
          fi

          /usr/bin/wde-autoscale-daemon &
          /usr/bin/wde-panel &

          exec /usr/bin/wde-wm
          EOF

      - name: Compile Core Binaries (X11 & GTK)
        run: |
          gcc src/wm.c -o wde-desktop/usr/bin/wde-wm -lX11
          g++ src/autoscale.cpp -o wde-desktop/usr/bin/wde-autoscale-daemon -lX11 -lXrandr
          g++ -std=c++17 src/start_menu.cpp -o wde-desktop/usr/bin/wde-startmenu $(pkg-config --cflags --libs gtk+-3.0 gio-2.0)
          g++ -std=c++17 src/panel.cpp -o wde-desktop/usr/bin/wde-panel $(pkg-config --cflags --libs gtk+-3.0 gdk-x11-3.0) -lX11

      - name: Set Executable Permissions
        run: |
          chmod +x wde-desktop/usr/bin/*
          chmod 755 wde-desktop/DEBIAN/control

      - name: Build DEB Package
        run: |
          dpkg-deb --build wde-desktop wde_1.0.0-alpha_amd64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wde-deb
          path: wde_1.0.0-alpha_amd64.deb

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: nightly
          name: "WDE X11 Nightly Build"
          prerelease: true
          files: wde_1.0.0-alpha_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
