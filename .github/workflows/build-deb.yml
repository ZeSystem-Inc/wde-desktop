name: Build XFCE5 Package

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y g++ libx11-dev qt6-base-dev qt6-base-dev-tools

      - name: Create Package Directory Structure
        run: |
          mkdir -p xfce5-desktop/usr/bin
          mkdir -p xfce5-desktop/usr/share/xsessions
          mkdir -p xfce5-desktop/DEBIAN

      - name: Generate Package Control & Desktop Files
        run: |
          cat << 'EOF' > xfce5-desktop/DEBIAN/control
          Package: xfce5
          Version: 5.0.0-alpha
          Section: x11
          Priority: optional
          Architecture: amd64
          Maintainer: Salih <salih@example.com>
          Depends: libx11-6, qt6-base-dev, rofi, x11-xserver-utils
          Description: XFCE5 Native Desktop Environment without Openbox dependency.
          EOF

          cat << 'EOF' > xfce5-desktop/usr/share/xsessions/xfce5.desktop
          [Desktop Entry]
          Name=XFCE5
          Comment=XFCE5 Desktop Environment
          Exec=/usr/bin/xfce5-session
          Type=Application
          DesktopNames=XFCE5
          EOF

          cat << 'EOF' > xfce5-desktop/usr/bin/xfce5-session
          #!/bin/sh
          export XDG_CURRENT_DESKTOP=XFCE5
          export XDG_SESSION_TYPE=${XDG_SESSION_TYPE:-x11}

          /usr/bin/xfce5-autoscale-daemon
          if [ -f /tmp/xfce5_env ]; then
              . /tmp/xfce5_env
          fi

          /usr/bin/xfce5-panel &

          exec /usr/bin/xfce5-wm
          EOF

      - name: Compile XFCE5 Core Binaries
        run: |
          g++ -O2 src/autoscale.cpp -o xfce5-desktop/usr/bin/xfce5-autoscale-daemon -lX11
          g++ -O2 src/wm.cpp -o xfce5-desktop/usr/bin/xfce5-wm -lX11
          g++ -O2 src/panel.cpp -o xfce5-desktop/usr/bin/xfce5-panel -fPIC $(pkg-config --cflags --libs Qt6Widgets)

      - name: Set Permissions
        run: |
          chmod +x xfce5-desktop/usr/bin/*
          chmod 755 xfce5-desktop/DEBIAN/control

      - name: Build DEB Package
        run: |
          dpkg-deb --build xfce5-desktop xfce5_5.0.0-alpha_amd64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfce5-deb
          path: xfce5_5.0.0-alpha_amd64.deb
