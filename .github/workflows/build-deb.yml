name: Build XFCE5 Package

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ pkg-config \
                              libwlroots-dev libwayland-dev wayland-protocols \
                              libgtk-3-dev libgtk-layer-shell-dev

      - name: Create Package Directory Structure
        run: |
          mkdir -p xfce5-desktop/usr/bin
          mkdir -p xfce5-desktop/usr/share/wayland-sessions
          mkdir -p xfce5-desktop/DEBIAN

      - name: Generate Package Control & Desktop Files
        run: |
          cat << 'EOF' > xfce5-desktop/DEBIAN/control
          Package: xfce5
          Version: 5.0.0-alpha
          Section: x11
          Priority: optional
          Architecture: amd64
          Maintainer: Salih <salih@example.com>
          Depends: libgtk-3-0, libgtk-layer-shell0, rofi, dbus-x11, adwaita-icon-theme, libwayland-server0
          Description: Native GTK3 Wayland Desktop Environment with Custom C Compositor (XFCE5).
          EOF

          cat << 'EOF' > xfce5-desktop/usr/share/wayland-sessions/xfce5.desktop
          [Desktop Entry]
          Name=XFCE5 (Wayland Native WM)
          Comment=XFCE5 Native Custom Wayland Compositor
          Exec=/usr/bin/xfce5-session
          Type=Application
          DesktopNames=XFCE5;XFCE;GTK;
          EOF

          cat << 'EOF' > xfce5-desktop/usr/bin/xfce5-session
          #!/bin/sh
          exec > /tmp/xfce5-session.log 2>&1
          echo "[XFCE5] Oturum Başlatılıyor..."

          export XDG_CURRENT_DESKTOP=XFCE5:XFCE
          export XDG_SESSION_DESKTOP=xfce5
          export XDG_SESSION_TYPE=wayland
          export GTK_THEME=Adwaita
          export GDK_BACKEND=wayland
          export QT_QPA_PLATFORM=wayland
          export MOZ_ENABLE_WAYLAND=1

          export WLR_RENDERER=pixman
          export WLR_NO_HARDWARE_CURSORS=1

          if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
              eval $(dbus-launch --sh-syntax --exit-with-session)
          fi

          /usr/bin/xfce5-autoscale-daemon &
          /usr/bin/xfce5-panel &

          exec /usr/bin/xfce5-wm
          EOF

      - name: Compile Core Binaries (C & C++)
        run: |
          gcc src/wm.c -o xfce5-desktop/usr/bin/xfce5-wm $(pkg-config --cflags --libs wayland-server wlroots)

          g++ src/autoscale.cpp -o xfce5-desktop/usr/bin/xfce5-autoscale-daemon

          g++ src/panel.cpp -o xfce5-desktop/usr/bin/xfce5-panel $(pkg-config --cflags --libs gtk+-3.0 gtk-layer-shell-0)

      - name: Set Permissions
        run: |
          chmod +x xfce5-desktop/usr/bin/*
          chmod 755 xfce5-desktop/DEBIAN/control

      - name: Build DEB Package
        run: |
          dpkg-deb --build xfce5-desktop xfce5_5.0.0-alpha_amd64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfce5-deb
          path: xfce5_5.0.0-alpha_amd64.deb

      - name: Publish Nightly Release (Main Push)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: nightly
          name: "XFCE5 Nightly Build"
          prerelease: true
          files: xfce5_5.0.0-alpha_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
