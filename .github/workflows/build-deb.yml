name: Build XFCE5 Package

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y g++ qt6-base-dev qt6-base-dev-tools

      - name: Create Package Directory Structure
        run: |
          mkdir -p xfce5-desktop/usr/bin
          mkdir -p xfce5-desktop/usr/share/wayland-sessions
          mkdir -p xfce5-desktop/DEBIAN

      - name: Generate Package Control & Desktop Files
        run: |
          cat << 'EOF' > xfce5-desktop/DEBIAN/control
          Package: xfce5
          Version: 5.0.0-alpha
          Section: x11
          Priority: optional
          Architecture: amd64
          Maintainer: Salih <salih@example.com>
          Depends: qt6-base-dev, rofi, labwc, wayland-protocols, xdg-desktop-portal-gtk, dbus-x11, adwaita-icon-theme, gtk-update-icon-cache
          Description: XFCE5 Lightweight GTK Native Wayland Desktop Environment.
          EOF

          cat << 'EOF' > xfce5-desktop/usr/share/wayland-sessions/xfce5.desktop
          [Desktop Entry]
          Name=XFCE5 (Wayland)
          Comment=XFCE5 Lightweight Desktop Environment
          Exec=/usr/bin/xfce5-session
          Type=Application
          DesktopNames=XFCE5;GTK;
          EOF

          cat << 'EOF' > xfce5-desktop/usr/bin/xfce5-session
          #!/bin/sh
          export XDG_CURRENT_DESKTOP=XFCE5
          export XDG_SESSION_TYPE=wayland
          export XDG_SESSION_DESKTOP=XFCE5

          export GDK_BACKEND=wayland,x11
          export QT_QPA_PLATFORM="wayland;xcb"
          export QT_STYLE_OVERRIDE=adwaita
          export GTK_THEME=Adwaita

          export WLR_RENDERER=pixman
          export WLR_NO_HARDWARE_CURSORS=1
          export LIBGL_ALWAYS_SOFTWARE=1

          if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
              eval $(dbus-launch --sh-syntax --exit-with-session)
          fi

          /usr/bin/xfce5-autoscale-daemon
          if [ -f /tmp/xfce5_env ]; then
              . /tmp/xfce5_env
          fi

          /usr/bin/xfce5-panel &

          exec labwc
          EOF

      - name: Compile Core Binaries
        run: |
          g++ -O2 src/autoscale.cpp -o xfce5-desktop/usr/bin/xfce5-autoscale-daemon
          g++ -O2 src/panel.cpp -o xfce5-desktop/usr/bin/xfce5-panel -fPIC $(pkg-config --cflags --libs Qt6Widgets)

      - name: Set Permissions
        run: |
          chmod +x xfce5-desktop/usr/bin/*
          chmod 755 xfce5-desktop/DEBIAN/control

      - name: Build DEB Package
        run: |
          dpkg-deb --build xfce5-desktop xfce5_5.0.0-alpha_amd64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfce5-deb
          path: xfce5_5.0.0-alpha_amd64.deb
