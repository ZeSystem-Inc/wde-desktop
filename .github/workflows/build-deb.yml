name: Build WDE Package

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ pkg-config \
                              libx11-dev libxft-dev libxinerama-dev libxrandr-dev \
                              libgtk-3-dev libglib2.0-dev zsh picom procps psmisc xdotool openbox

      - name: Compile Core Binaries directly from src/
        run: |
          mkdir -p wde-desktop/usr/bin
          g++ src/autoscale.cpp -o wde-desktop/usr/bin/wde-autoscale-daemon $(pkg-config --cflags --libs x11 xrandr) -lX11 -lXrandr
          g++ -std=c++17 src/start_menu.cpp -o wde-desktop/usr/bin/wde-startmenu $(pkg-config --cflags --libs gtk+-3.0 gio-2.0 gdk-x11-3.0 x11) -lX11
          g++ -std=c++17 src/panel.cpp -o wde-desktop/usr/bin/wde-panel $(pkg-config --cflags --libs gtk+-3.0 gdk-x11-3.0 x11) -lX11

      - name: Prepare Session Files & Package Structure
        run: |
          # Gerekli tüm dizinleri garantiye al
          mkdir -p wde-desktop/DEBIAN
          mkdir -p wde-desktop/usr/share/xsessions
          mkdir -p wde-desktop/usr/bin

          cp -r DEBIAN/* wde-desktop/DEBIAN/ 2>/dev/null || true

          if [ -f "wde-desktop/usr/share/xsessions/wde.desktop" ]; then
            echo "wde.desktop zaten wde-desktop dizininde mevcut."
          elif [ -f "xsessions/wde.desktop" ]; then
            cp xsessions/wde.desktop wde-desktop/usr/share/xsessions/
          fi

          if [ -f "src/wde-session" ]; then
            cp src/wde-session wde-desktop/usr/bin/wde-session
          elif [ -f "wde-session" ]; then
            cp wde-session wde-desktop/usr/bin/wde-session
          fi

          chmod +x wde-desktop/usr/bin/* 2>/dev/null || true
          chmod -R 755 wde-desktop/DEBIAN
          chmod 644 wde-desktop/usr/share/xsessions/*.desktop 2>/dev/null || true

      - name: Build DEB Package
        run: |
          dpkg-deb --build wde-desktop wde_1.0.0-alpha_amd64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wde-deb
          path: wde_1.0.0-alpha_amd64.deb

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: nightly
          name: "WDE Nightly Build"
          prerelease: true
          files: wde_1.0.0-alpha_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
